name: Publish Sphinx documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'manuscript/**'
      - 'experiments/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'scripts/build_docs.sh'
      - 'scripts/verify_manuscript_data.py'
      - 'scripts/audit_known_order_provenance.py'
      - 'certificates/scalar-lift/known-order-provenance.json'
      - 'certificates/scalar-lift/known-order-paley-comparison.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install the documentation dependencies
        run: python -m pip install -e '.[docs]' -c docs/requirements.txt
      - name: Install the PDF build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            latexmk fonts-lmodern fonts-dejavu-core cm-super-minimal
      - name: Check the manuscript's finite inputs and Lean literal bindings
        run: |
          python scripts/verify_manuscript_data.py
          python scripts/check_lean_literal_data.py
          python scripts/check_lean_additional_sources.py
          python scripts/audit_known_order_provenance.py --check
          python -m experiments.scalar_lift.known_order_comparisons --check certificates/scalar-lift/known-order-paley-comparison.json
          python release/additional_source_verification/source/verify.py --check-only
      - name: Build the current manuscript
        working-directory: manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build hadamard_7572_announcement.tex
      - name: Build HTML, run examples and build the manual PDF
        run: |
          ./scripts/build_docs.sh all
          cp docs/_build/latex/butson-towers-manual.pdf docs/_build/html/
          cp manuscript/build/hadamard_7572_announcement.pdf docs/_build/html/butson-towers-paper.pdf
      - name: Upload the documentation site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
